version: '3.8'

services:
  postgres_db:
    image: postgres:16-alpine
    container_name: local_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: learning_postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_local_data:/var/lib/postgresql/data

# Reserve permanent folders on your laptop so data is never wiped out on restart
volumes:
  postgres_local_data: